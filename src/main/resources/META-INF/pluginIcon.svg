<!-- The plugin's logo: the ACX monogram on a rounded plate.

     Drawn on a 20x20 grid with even stroke weights and a fan of rays; the third letter is an X, and the
     plate is indigo, so the mark is told apart at a glance in the side bar and in the list of installed
     plugins.

     The plate - the pale frame and the field inside it - is the trace of the original raster, which is
     why those two paths are long and are not edited by hand; only their colours are this plugin's. What
     stands on it is drawn: the same letters and rays as the side bar button
     (src/main/resources/icons/toolWindow.svg) - a tick with a crossbar, an arc, and two crossed strokes.
     The X stands clear of the C rather than through its lower end: drawn square on the mark's diagonal,
     one of its arms ran exactly along the radius the C ends on, and at the size a plugin is really seen at
     the two letters merged into one blot. The mark is pale ice rather than plain white: on this indigo,
     white is a second bright thing beside the frame instead of the one thing the eye goes to.

     The marketplace asks for a 40x40 canvas with the mark inside 36x36, and the same file feeds the phone
     client's icons (scripts/mobile-icons.py) and the logos in assets/, which is why the mark is one group
     with an id rather than paths scattered through the plate.

     The mark's placement is measured rather than eyeballed: its box on the 20x20 grid it is drawn on is
     (1.8, 2.0)-(18.4, 17.0), fitted to 21 of the canvas and centred on it. -->
<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="acxBg" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C83FF"/>
      <stop offset="1" stop-color="#5A55E6"/>
    </linearGradient>
    <!-- The mark is strokes rather than one filled shape, so this one is in user space: left to the
         default, every letter and every ray would get a gradient of its own across its own little box,
         and the fan would come out banded instead of lit from above. The span is the mark's own grid
         (y from 2.0 to 17.0), which the group's transform carries along with it. -->
    <linearGradient id="acxMark" gradientUnits="userSpaceOnUse" x1="0" y1="2.0" x2="0" y2="17.0">
      <stop offset="0" stop-color="#F5F6FF"/>
      <stop offset="1" stop-color="#CCD3FF"/>
    </linearGradient>
  </defs>
  <g id="plate" transform="translate(1.975,1.95) scale(0.05)">
    <g transform="translate(0,722) scale(0.1,-0.1)" fill="#E2E3FF"><path d="M906 7199 c-386 -57 -714 -342 -826 -719 -52 -174 -50 -66 -50 -2872
0 -2836 -2 -2738 55 -2912 104 -319 363 -563 692 -654 l98 -27 2680 -3 c1957
-2 2702 0 2760 8 417 60 746 375 843 810 16 69 17 281 17 2790 l0 2715 -22 81
c-103 389 -370 658 -758 767 l-80 22 -2675 1 c-1473 1 -2702 -2 -2734 -7z"/></g>
    <g transform="translate(0,722) scale(0.1,-0.1)" fill="url(#acxBg)"><path d="M1193 6865 c-429 -78 -758 -436 -813 -885 -14 -115 -14 -4600 0
-4760 13 -145 39 -241 95 -349 117 -225 359 -416 615 -483 l85 -23 2425 0
2425 0 110 29 c172 44 335 117 335 150 0 6 18 25 40 42 95 73 225 263 273 400
49 137 48 82 45 2649 l-3 2420 -26 96 c-93 332 -346 591 -684 696 l-90 28
-2380 2 c-1922 1 -2394 -1 -2452 -12z"/></g>
  </g>
  <g id="mark" transform="translate(7.223,7.982) scale(1.2651)" fill="none" stroke="url(#acxMark)"
     stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="1.6">
      <path d="M1.8 9.6 5.2 2.0 8.6 9.6"/>
      <path d="M3.1 7.0H7.3"/>
      <path d="M13.0 7.8A3.4 3.4 0 1 0 13.0 12.6"/>
      <path d="M13.3 11.6 18.4 17.0"/>
      <path d="M18.4 11.6 13.3 17.0"/>
    </g>
    <g stroke-width="0.95">
      <path d="M11.71 5.30 12.53 3.05"/>
      <path d="M13.68 6.32 15.80 4.20"/>
      <path d="M14.70 8.29 16.95 7.47"/>
      <path d="M8.29 14.70 7.47 16.95"/>
      <path d="M6.32 13.68 4.20 15.80"/>
      <path d="M5.30 11.71 3.05 12.53"/>
    </g>
  </g>
</svg>
